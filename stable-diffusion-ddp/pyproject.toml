[project]
name = "stable-diffusion-ddp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch==2.12.0+cu130",
    "torchvision==0.27.0+cu130",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "tensorboard>=2.17.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
